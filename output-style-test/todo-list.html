<!DOCTYPE html>
<html lang="ko">
<head>
    <!-- HTML 문서의 기본 정보를 설정하는 부분입니다 -->

    <!-- 한글 글자가 제대로 보이도록 UTF-8 인코딩을 설정합니다 -->
    <meta charset="UTF-8">

    <!-- 모바일 기기에서도 잘 보이도록 뷰포트를 설정합니다 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- 페이지 제목을 설정합니다 (브라우저 탭에 표시됨) -->
    <title>할 일 목록 앱</title>

    <!-- Tailwind CSS를 인터넷에서 가져옵니다 (스타일 작성 없이 클래스 이름으로 디자인할 수 있음) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!--
        몸체 부분입니다.

        마치 냉장고에 붙이는 메모지처럼 생각해보세요!
        - 입력 칸: 새로운 할 일을 적는 부분
        - 목록: 적은 할 일들을 보여주는 부분
        - 체크박스: "이거 다 했어!" 표시하는 부분
        - 삭제 버튼: 더 이상 필요 없는 할 일을 없애는 부분
    -->

    <!-- 전체 배경을 연한 회색으로 설정하고, 화면 전체를 채우도록 설정 -->
    <div class="min-h-screen bg-gray-100 flex items-center justify-center py-8">

        <!-- 할 일 목록을 담을 카드 (마치 프레임처럼 생각하면 됩니다) -->
        <div class="bg-white rounded-lg shadow-lg p-8 w-full max-w-md">

            <!-- 페이지 제목 -->
            <h1 class="text-3xl font-bold text-gray-800 mb-6">할 일 목록</h1>

            <!--
                할 일을 입력하는 부분입니다.

                입력 필드 + 추가 버튼으로 구성되어 있습니다:
                - 입력 필드: 새로운 할 일을 타이핑하는 곳
                - 추가 버튼: 입력한 할 일을 목록에 추가하는 버튼
            -->
            <div class="flex gap-2 mb-6">
                <!--
                    할 일을 입력하는 텍스트 필드입니다.
                    id="todoInput" : JavaScript에서 이 요소를 찾기 위한 이름표
                -->
                <input
                    type="text"
                    id="todoInput"
                    placeholder="새로운 할 일을 입력하세요..."
                    class="flex-1 px-4 py-2 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500 transition"
                >

                <!--
                    할 일을 추가하는 버튼입니다.
                    onclick="addTodo()" : 버튼을 클릭하면 addTodo 함수가 실행됩니다.
                -->
                <button
                    onclick="addTodo()"
                    class="px-6 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition font-semibold"
                >
                    추가
                </button>
            </div>

            <!--
                할 일 목록을 표시할 부분입니다.

                id="todoList" : JavaScript에서 이 목록을 찾기 위한 이름표
                새로 추가된 할 일들이 이 곳에 들어갑니다.
            -->
            <ul id="todoList" class="space-y-2">
                <!-- 할 일 항목들이 여기에 동적으로 추가됩니다 -->
            </ul>
        </div>
    </div>

    <script>
        // ====================================================
        // JavaScript 부분입니다.
        // HTML을 조작하고 사용자의 행동에 반응하는 코드가 들어갑니다.
        // ====================================================

        //
        // 함수 1: 새로운 할 일을 추가하는 함수
        // addTodo는 "할 일을 더하다" 라는 뜻입니다.
        //
        // 동작:
        // 1. 입력 필드에서 사용자가 입력한 텍스트를 가져옵니다
        // 2. 텍스트가 비어있지 않은지 확인합니다
        // 3. 새로운 할 일 항목을 만듭니다
        // 4. 목록에 추가합니다
        // 5. 입력 필드를 비웁니다
        //
        function addTodo() {
            // 입력 필드에서 사용자가 입력한 텍스트를 가져옵니다
            // getElementById("todoInput")는 id="todoInput"인 요소를 찾는 것입니다
            const todoInput = document.getElementById("todoInput");
            const todoText = todoInput.value.trim(); // 앞뒤 공백 제거

            // 입력 필드가 비어있으면 함수를 중단합니다
            // alert는 팝업 메시지를 보여줍니다
            if (todoText === "") {
                alert("할 일을 입력해주세요!");
                return; // 여기서 함수를 멈춥니다
            }

            // 새로운 할 일 항목을 만듭니다
            // document.createElement("li")는 <li></li> 태그를 만듭니다
            const li = document.createElement("li");

            // 만든 <li> 태그에 HTML 내용을 추가합니다
            // innerHTML은 태그 안에 HTML을 삽입하는 것입니다
            li.innerHTML = `
                <!-- 체크박스와 텍스트, 삭제 버튼을 한 줄에 배치합니다 -->
                <div class="flex items-center gap-3 p-3 bg-gray-50 rounded-lg hover:bg-gray-100 transition">
                    <!--
                        체크박스입니다.
                        onchange="toggleTodo(this)" : 체크박스를 체크하면 toggleTodo 함수가 실행됩니다
                        this는 현재 이 체크박스 자신을 의미합니다
                    -->
                    <input
                        type="checkbox"
                        class="w-5 h-5 cursor-pointer"
                        onchange="toggleTodo(this)"
                    >

                    <!-- 할 일 텍스트를 표시합니다 -->
                    <!-- class="flex-1"은 이 요소가 남은 공간을 모두 차지하도록 합니다 -->
                    <span class="flex-1 text-gray-800">
                        ${todoText}
                    </span>

                    <!--
                        삭제 버튼입니다.
                        onclick="deleteTodo(this)" : 버튼을 클릭하면 deleteTodo 함수가 실행됩니다
                    -->
                    <button
                        onclick="deleteTodo(this)"
                        class="px-3 py-1 bg-red-500 text-white rounded hover:bg-red-600 transition text-sm font-semibold"
                    >
                        삭제
                    </button>
                </div>
            `;

            // 만든 항목을 목록에 추가합니다
            // getElementById("todoList")는 id="todoList"인 요소(ul)를 찾습니다
            document.getElementById("todoList").appendChild(li);

            // 입력 필드를 비웁니다 (사용자가 새로운 할 일을 입력할 준비가 되게)
            todoInput.value = "";

            // 입력 필드에 커서를 다시 놓습니다 (바로 입력할 수 있게)
            todoInput.focus();
        }

        //
        // 함수 2: 할 일을 "완료했어!" 표시하거나 취소하는 함수
        // toggleTodo는 "토글하다" 즉, "on/off를 바꾸다" 라는 뜻입니다.
        //
        // 동작:
        // 1. 체크박스의 체크 여부를 확인합니다
        // 2. 체크되었으면: 텍스트에 줄을 그어서 "완료했어!" 표시
        // 3. 체크 해제되었으면: 줄을 없애서 "아직 안 했어!" 표시
        //
        function toggleTodo(checkbox) {
            // this.parentElement는 현재 체크박스의 부모 요소를 의미합니다
            // (체크박스를 감싸고 있는 div)
            const todoItem = checkbox.parentElement.parentElement;

            // checkbox의 부모인 div 내에서 span 찾기
            const todoText = checkbox.parentElement.querySelector("span");

            // 체크박스가 체크되어있는지 확인합니다
            if (checkbox.checked) {
                // 체크되었다면: 텍스트에 "완료" 스타일을 적용합니다
                // line-through는 텍스트 위에 줄을 그어줍니다
                todoText.classList.add("line-through", "text-gray-400");
            } else {
                // 체크 해제되었다면: "완료" 스타일을 제거합니다
                // classList.remove는 클래스를 제거합니다
                todoText.classList.remove("line-through", "text-gray-400");
            }
        }

        //
        // 함수 3: 할 일을 삭제하는 함수
        // deleteTodo는 "할 일을 지우다" 라는 뜻입니다.
        //
        // 동작:
        // 1. 삭제 버튼이 클릭됩니다
        // 2. 버튼의 부모 요소들을 따라가서 전체 할 일 항목(<li>)을 찾습니다
        // 3. 그 항목을 목록에서 제거합니다
        //
        function deleteTodo(button) {
            // button.parentElement.parentElement는 <li> 태그를 찾습니다
            // (button -> div -> li 순서로 거슬러 올라갑니다)
            const li = button.parentElement.parentElement;

            // remove() 메서드로 <li>를 완전히 삭제합니다
            // 마치 냉장고에서 메모지를 떼어내는 것처럼요!
            li.remove();
        }

        //
        // Enter 키를 눌러도 할 일이 추가되도록 설정합니다
        //
        // 동작:
        // 1. 입력 필드에서 키를 눌렀는지 감지합니다
        // 2. 만약 Enter 키가 눌렸다면 addTodo() 함수를 실행합니다
        //

        // 입력 필드를 찾습니다
        const todoInput = document.getElementById("todoInput");

        // 입력 필드에 "키를 눌렀을 때" 이벤트를 추가합니다
        todoInput.addEventListener("keypress", function(event) {
            // event.key는 누른 키가 무엇인지 알려줍니다
            // "Enter"는 엔터 키를 의미합니다
            if (event.key === "Enter") {
                // 엔터 키가 눌렸다면 addTodo() 함수를 실행합니다
                addTodo();
            }
        });
    </script>
</body>
</html>
